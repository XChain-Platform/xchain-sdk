# Slim per-repo CI: delegates to the shared reusable workflow.
# Pinned @master so a push to the reusable definition propagates on the next run.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@master
    with:
      # Opt into the perf gate: the SDK's perf suite (Validator throughput) needs
      # no infra, so it runs cleanly as a post-gate step. First adopter of run-perf.
      run-perf: true
      perf-script: "test:performance"

  # Cross-repo drift guards (SD-1 / ): this repo vendors the canonical
  # coin registry from xchain-hub, and per-repo CI cannot see sibling repos, so
  # a drifted vendored copy previously shipped green (the byte-identity checks
  # ran only in the monorepo's manual bin/ci-all.sh). This job recreates the
  # sibling layout (self + canonical side by side) and runs the same checks.
  # The canonical repo is private pre-launch, so its checkout uses a read-only
  # deploy key; drop the ssh-key line when the repos flip public at launch.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-sdk

      - name: Check out the canonical coin registry (xchain-hub)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Coin-registry byte-identity vs canonical
        run: xchain-hub/bin/sync-coins.sh --check --only xchain-sdk

      - name: Coin consensus-pin conformance (own vendored bundle)
        working-directory: xchain-sdk
        run: |
          node -e '
            const coins = require("./src/coins");
            for (const net of ["testnet", "regtest"]) {
              const res = coins.verifyConsensusPin(net);
              if (res && res.skipped) throw new Error("consensus pin unexpectedly unarmed for " + net);
            }
            console.log("consensus pin conformance OK (testnet, regtest)");
          '

      # The SDK also vendors the contract-ABI extraction core, canonical in
      # xchain-explorer, so server render and SDK/wallet clients parse a
      # declared abi identically. Same drift class, same fix.
      - name: Check out the canonical abi-core (xchain-explorer)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-explorer
          ssh-key: ${{ secrets.XCHAIN_EXPLORER_DEPLOY_KEY }}
          path: xchain-explorer

      - name: Contract abi-core byte-identity vs canonical
        run: xchain-explorer/bin/sync-abi-core.sh --check
