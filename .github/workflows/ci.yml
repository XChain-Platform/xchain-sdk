# Slim per-repo CI: delegates to the shared reusable workflow.
# Pinned to a commit SHA so a change to the reusable definition only lands here on a deliberate SHA bump.
name: CI

# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  push:
    # develop is where all work lands; master only ever receives release PRs.
    # Both run the gate: develop so a lane push is verified as it lands, master
    # so the merge commit a release tag points at has its own green run.
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@6f4d39ae85787fc31e90a31588d87610a2c33103 # pin: XChain-Platform/.github @ master 2026-08-14; bump deliberately
    with:
      # The fleet's consensus runtime; a floating "22" now resolves 22.23.3, which the VM runtime gate refuses.
      node-version: "22.23.4"
      # A hotfix or release PR compares against siblings at the same branch, not develop.
      siblings-ref: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) && github.head_ref || github.base_ref || '' }}
      # Opt into the perf gate: the SDK's perf suite (Validator throughput) needs
      # no infra, so it runs cleanly as a post-gate step. First adopter of run-perf.
      run-perf: true
      perf-script: "test:performance"

  # Cross-repo drift guards (SD-1): this repo vendors the canonical
  # coin registry from xchain-hub, and per-repo CI cannot see sibling repos, so
  # a drifted vendored copy previously shipped green (the byte-identity checks
  # ran only in the monorepo's manual bin/ci-all.sh). This job recreates the
  # sibling layout (self + canonical side by side) and runs the same checks.
  # The canonical repo is private pre-launch, so its checkout uses a read-only
  # deploy key; drop the ssh-key line when the repos flip public at launch.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-sdk

      - name: Check out the canonical coin registry (xchain-hub)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          # Release-aware like the shared-workflow call above: on a release PR each
          # canonical sibling is read at the sibling release branch, because develop
          # keeps moving under the frozen train (the indexer handler map this gate
          # grades is re-pinned at every indexer develop landing).
          ref: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) && github.head_ref || github.base_ref || (github.ref == 'refs/heads/master' && 'master' || 'develop') }}
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      # preflight_handler_dirs.js requires acorn, declared in this repo package.json; the
      # job checks the sdk out under xchain-sdk/ and nothing installed it.
      - name: Install dependencies
        working-directory: xchain-sdk
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coin-registry byte-identity vs canonical
        run: xchain-hub/bin/sync-coins.sh --check --only xchain-sdk

      - name: Coin consensus-pin conformance (own vendored bundle)
        working-directory: xchain-sdk
        run: |
          node -e '
            const coins = require("./src/coins");
            for (const net of ["testnet", "regtest"]) {
              const res = coins.verifyConsensusPin(net);
              if (res && res.skipped) throw new Error("consensus pin unexpectedly unarmed for " + net);
            }
            console.log("consensus pin conformance OK (testnet, regtest)");
          '

      # The SDK also vendors the contract-ABI extraction core, canonical in
      # xchain-explorer, so server render and SDK/wallet clients parse a
      # declared abi identically. Same drift class, same fix.
      - name: Check out the canonical abi-core (xchain-explorer)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-explorer
          # Release-aware like the shared-workflow call above: on a release PR each
          # canonical sibling is read at the sibling release branch, because develop
          # keeps moving under the frozen train (the indexer handler map this gate
          # grades is re-pinned at every indexer develop landing).
          ref: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) && github.head_ref || github.base_ref || (github.ref == 'refs/heads/master' && 'master' || 'develop') }}
          ssh-key: ${{ secrets.XCHAIN_EXPLORER_DEPLOY_KEY }}
          path: xchain-explorer

      - name: Contract abi-core byte-identity vs canonical
        run: xchain-explorer/bin/sync-abi-core.sh --check

      # Route contract: every explorer.<method>(query, '<type>') call
      # must use a type that route actually accepts. Mock-based unit tests
      # cannot see this - a stub answers to any type string - and the miss
      # shipped a blanket false block on DISPENSE. The explorer checkout above
      # is the route table, so REQUIRE_SIBLINGS turns the local skip into a
      # hard failure here.
      - name: Explorer route contract
        working-directory: xchain-sdk
        env:
          XCHAIN_REQUIRE_SIBLINGS: "1"
        run: npx mocha test/unit/clients/explorer_route_contract.test.js

      # Pre-flight drift gate (confirm/decode/pre-flight spec §8.5). The Tier-2
      # checks in src/preflight/checks/ mirror validity logic that is
      # authoritative in xchain-indexer src/actions/*.js. The gate runs on BOTH
      # repos deliberately: the indexer side catches a handler change that
      # outruns the mirror, and this side catches a map edit made without a
      # handler to justify it (refreshing a hash to silence the gate is exactly
      # the move it exists to prevent, and it can only be seen from here).
      - name: Check out the authoritative handlers (xchain-indexer)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-indexer
          # Release-aware like the shared-workflow call above: on a release PR each
          # canonical sibling is read at the sibling release branch, because develop
          # keeps moving under the frozen train (the indexer handler map this gate
          # grades is re-pinned at every indexer develop landing).
          ref: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) && github.head_ref || github.base_ref || (github.ref == 'refs/heads/master' && 'master' || 'develop') }}
          ssh-key: ${{ secrets.XCHAIN_INDEXER_DEPLOY_KEY }}
          path: xchain-indexer

      # REQUIRE_SIBLINGS because the step above checks the sibling out: if that
      # checkout is ever dropped or renamed, the gate must fail rather than skip
      # its way to a green job having compared no handler at all.
      - name: Pre-flight <-> handler drift gate
        env:
          XCHAIN_INDEXER_PATH: ${{ github.workspace }}/xchain-indexer
          XCHAIN_REQUIRE_SIBLINGS: "1"
        run: node xchain-sdk/bin/check-preflight-drift.js

  # Coverage ratchet: re-run the unit suite under c8 and fail if line or
  # branch coverage drops below this repo's floor in bin/coverage-thresholds.json
  # (mirrored into the `coverage:check` npm script). Catches silent coverage
  # regression the pass/fail gate cannot see: a change that keeps every test green
  # while deleting the only test that reached a file. These are RATCHET FLOORS
  # (~1-1.5 points below measured), not tier targets; raise them as coverage climbs.
  coverage:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The ratchet re-runs the unit suite, so it needs the same siblings the gate
      # gets. Without them the guards that read a sibling skip silently, so the
      # ratchet measures a suite the gate never ran: 3572 of 3731 unit tests ran without them.
      # Same roster (.ci-siblings) and same layout the shared workflow uses.
      - name: Check out declared sibling repositories
        uses: XChain-Platform/.github/actions/checkout-siblings@master # one definition for every call site; see the action for why this tracks master
        with:
          ref: ${{ (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/')) && github.head_ref || github.base_ref || '' }}

      # master trails contracts develop, so a master run tests the pinned commit; develop keeps tracking develop.
      - name: Pin xchain-contracts to the tested commit
        if: github.ref == 'refs/heads/master' || github.base_ref == 'master'
        run: bin/pin-contracts-sibling.sh

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coverage thresholds (c8 --check-coverage)
        run: npm run coverage:check

  # Suite-title pin: every collected test title, per npm script, must still be
  # collected. mocha --dry-run loads the spec files without running a body, so no
  # database is needed. Declared standalone (no needs: ci) so a stale pin reads as
  # its own red job and never hides the gate's result; the rename map carries the moves a restructure declares.
  suite-title-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-sdk

      - name: Check out the re-taken SDK suite-title pin
        uses: actions/checkout@v4
        with:
          ref: ed715d88a82023db589a9ceebdab8e97389e5992
          path: suite-title-pins/sdk/xchain-sdk

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: xchain-sdk/package-lock.json

      - name: Install suite-title collector dependencies
        run: |
          set -euo pipefail
          for repo in xchain-sdk suite-title-pins/sdk/xchain-sdk; do
            (cd "$repo" && if [ -f package-lock.json ]; then npm ci; else npm install; fi)
          done

      - name: Pinned suite titles still collected; additions warn
        run: |
          set -euo pipefail
          (cd suite-title-pins/sdk/xchain-sdk && \
            node bin/suite-title-map.js --out "$RUNNER_TEMP/sdk-suite-titles.json")

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const workspace = process.env.GITHUB_WORKSPACE;
          const root = path.join(workspace, 'xchain-sdk');
          const suiteTitles = require(path.join(root, 'bin/suite-title-map.js'));
          const pin = JSON.parse(fs.readFileSync(
              path.join(process.env.RUNNER_TEMP, 'sdk-suite-titles.json'), 'utf8'));
          const renames = JSON.parse(fs.readFileSync(
              path.join(root, 'bin/pins/suite-title-renames.json'), 'utf8'));
          const blockingKinds = new Set(['file_dropped', 'title_dropped']);
          const escapeCommand = (value) => String(value)
              .replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const exitCodeFor = (blockingCount) => blockingCount ? 1 : 0;
          const reportDifferences = (repositoryName, differences, write = console.log) => {
              const blocking = differences.filter((difference) => blockingKinds.has(difference.kind));
              if (!differences.length) {
                  write(`${repositoryName}: suite identity holds against the re-taken pin`);
                  return { blockingCount: 0, differenceCount: 0 };
              }

              write(`${repositoryName}: ${differences.length} difference(s); ${blocking.length} blocking`);
              for (const difference of differences.slice(0, 200)) {
                  const isBlocking = blockingKinds.has(difference.kind);
                  const message = [
                      `[${repositoryName}/${difference.script}]`, difference.kind, difference.file || '',
                      difference.title ? `:: ${difference.title}` : difference.detail || '',
                  ].filter(Boolean).join(' ');
                  write(`::${isBlocking ? 'error' : 'warning'}::${escapeCommand(message)}`);
              }
              if (differences.length > 200)
                  write(`${repositoryName}: ... and ${differences.length - 200} more`);
              return { blockingCount: blocking.length, differenceCount: differences.length };
          };

          process.chdir(root);
          const fresh = suiteTitles.buildMap();
          const differences = suiteTitles.compare(pin, fresh, renames);
          const result = reportDifferences('sdk', differences);

          const fixturePin = {
              titleSets: { pinned: ['kept title'] },
              scripts: { test: { files: { 'test/pinned.test.js': 'pinned' } } },
          };
          const policyCases = [
              ['file_added', {
                  titleSets: { pinned: ['kept title'] },
                  scripts: { test: { files: {
                      'test/pinned.test.js': 'pinned', 'test/new.test.js': 'pinned',
                  } } },
              }, 'warning', 0],
              ['title_added', {
                  titleSets: { grown: ['kept title', 'new title'] },
                  scripts: { test: { files: { 'test/pinned.test.js': 'grown' } } },
              }, 'warning', 0],
              ['file_dropped', {
                  titleSets: {}, scripts: { test: { files: {} } },
              }, 'error', 1],
              ['title_dropped', {
                  titleSets: { empty: [] },
                  scripts: { test: { files: { 'test/pinned.test.js': 'empty' } } },
              }, 'error', 1],
          ];
          for (const [kind, freshCase, annotation, expectedExitCode] of policyCases) {
              const caseDifferences = suiteTitles.compare(fixturePin, freshCase, {}, 'test');
              const kinds = caseDifferences.map((difference) => difference.kind);
              const output = [];
              const caseResult = reportDifferences(
                  'falsification', caseDifferences, (line) => output.push(line));
              const annotationPrefix = `::${annotation}::`;
              if (kinds.length !== 1 || kinds[0] !== kind
                  || !output.some((line) => line.startsWith(annotationPrefix) && line.includes(kind))
                  || exitCodeFor(caseResult.blockingCount) !== expectedExitCode) {
                  throw new Error(`suite-title policy rejected its ${kind} falsification case`);
              }
          }
          console.log(`suite-title policy falsification passed (${policyCases.length} cases)`);

          const summary = [
              '### suite-title-pin',
              '',
              `Commit: \`${process.env.GITHUB_SHA}\``,
              `Differences: ${result.differenceCount}`,
              `Blocking drops: ${result.blockingCount}`,
              '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          process.exitCode = exitCodeFor(result.blockingCount);
          NODE
